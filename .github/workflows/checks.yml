name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv run trafficai --help
      - name: Optional AI dependency compatibility (no model downloads)
        run: |
          uv sync --locked --extra ai
          uv run --extra ai python -c "from transformers import DepthProForDepthEstimation, SegformerForSemanticSegmentation"
